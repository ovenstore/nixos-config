[bar.default]
center = [ "clock", "date", "control-center", "weather" ]
end = [ "tray", "notifications", "clipboard", "bluetooth", "volume", "brightness", "battery", "network", "session" ]
margin_ends = 0
padding = 18
radius_top_left = 0
radius_top_right = 0
widget_spacing = 14

[battery]
warning_threshold = 20

[control_center]
hidden_tabs = [ "audio", "monitor", "screen-time" ]
sidebar = "full"
sidebar_section = "none"
width = 800

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
launcher_position = "start"
pinned = [ "firefox", "obsidian", "dev.noctalia.Noctalia" ]
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 960.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.79999998211860657
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 872.5
    cy = 644.0
    output = "eDP-1"
    placement_height = 1164.0
    placement_width = 1745.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 872.5
    cy = 411.0
    output = "eDP-1"
    placement_height = 1164.0
    placement_width = 1745.0
    rotation = 0.0
    type = "clock"

[osd]
offset_y = 30
position = "bottom_center"
position_vertical = "bottom_center"

[shell]
app_icon_color = "secondary"
external_ip_enabled = true
font_family = "DejaVu Sans Condensed"
polkit_agent = true

    [shell.animation]
    speed = 1.2500000186264515

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.4999999888241291

[theme]
builtin = "Eldritch"
community_palette = "Kanagawa Dragon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "ghostty", "helix", "kitty", "niri" ]

[wallpaper]
directory = "/home/oven/nixos-config/wallpapers"

    [wallpaper.default]
    path = "/home/oven/nixos-config/wallpapers/waterfall-green.png"

    [wallpaper.last]
    path = "/home/oven/nixos-config/wallpapers/waterfall-green.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/oven/nixos-config/wallpapers/waterfall-green.png"

[weather]
refresh_minutes = 60
unit = "imperial"

[widget.weather]
show_condition = false
